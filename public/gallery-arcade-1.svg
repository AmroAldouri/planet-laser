<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#08080f"/><stop offset="1" stop-color="#020205"/></linearGradient>
    <filter id="ag" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="800" fill="url(#ar)"/>
  <rect x="50" y="120" width="700" height="560" rx="16" fill="#0f0f1a"/>
  <!-- arcade cabinets row -->
  <rect x="80" y="220" width="140" height="280" rx="8" fill="#161628"/>
  <rect x="250" y="200" width="140" height="300" rx="8" fill="#161628"/>
  <rect x="420" y="215" width="140" height="285" rx="8" fill="#161628"/>
  <rect x="590" y="230" width="140" height="270" rx="8" fill="#161628"/>
  <!-- screens + neon marquees green -->
  <rect x="92" y="235" width="116" height="92" rx="3" fill="#0a1420"/>
  <rect x="262" y="215" width="116" height="92" rx="3" fill="#0a1420"/>
  <rect x="432" y="230" width="116" height="92" rx="3" fill="#0a1420"/>
  <rect x="602" y="245" width="116" height="92" rx="3" fill="#0a1420"/>
  <g fill="#00FF9F" filter="url(#ag)">
    <rect x="90" y="188" width="120" height="9" rx="1" opacity=".9"/>
    <rect x="260" y="168" width="120" height="9" rx="1" opacity=".85"/>
    <rect x="430" y="183" width="120" height="9" rx="1" opacity=".95"/>
    <rect x="600" y="198" width="120" height="9" rx="1" opacity=".8"/>
  </g>
  <!-- redemption game elements -->
  <circle cx="150" cy="370" r="22" fill="#222233"/><circle cx="150" cy="370" r="11" fill="#39FF14" opacity=".7"/>
  <rect x="280" y="340" width="80" height="14" rx="2" fill="#222233"/>
  <!-- tickets -->
  <g fill="#00FF9F" opacity=".6"><rect x="105" y="420" width="18" height="5" rx="1"/><rect x="128" y="423" width="14" height="5" rx="1"/><rect x="113" y="430" width="22" height="5" rx="1"/></g>
  <rect width="800" height="800" fill="#000" opacity=".1"/>
</svg>