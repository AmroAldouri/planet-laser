<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06060f"/>
      <stop offset="40%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#020208"/>
    </linearGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111122"/>
      <stop offset="100%" stop-color="#05050c"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="40%" r="80%" fx="50%" fy="30%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="laserGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9F" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00FF9F" stop-opacity="1"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neonGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Deep space dark bg -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- Distant arena walls / architecture -->
  <rect x="120" y="220" width="1680" height="620" rx="12" fill="#0f0f1f" opacity="0.9"/>
  <!-- Multi level platforms -->
  <rect x="180" y="420" width="420" height="38" rx="4" fill="#1a1a2e"/>
  <rect x="1320" y="420" width="420" height="38" rx="4" fill="#1a1a2e"/>
  <rect x="280" y="580" width="320" height="32" rx="3" fill="#151528"/>
  <rect x="1320" y="580" width="320" height="32" rx="3" fill="#151528"/>
  <!-- Upper catwalk -->
  <rect x="480" y="310" width="960" height="22" rx="3" fill="#12121f"/>
  <!-- Fog / atmosphere layers -->
  <rect x="0" y="480" width="1920" height="300" fill="#0c0c18" opacity="0.45"/>
  <!-- Floor grid -->
  <rect y="760" width="1920" height="320" fill="url(#floor)"/>
  <g opacity="0.25" stroke="#00FF9F" stroke-width="1">
    <path d="M0 820 L1920 820"/>
    <path d="M0 880 L1920 880"/>
    <path d="M0 940 L1920 940"/>
    <path d="M0 1020 L1920 1020"/>
    <path d="M120 760 L120 1080"/>
    <path d="M320 760 L320 1080"/>
    <path d="M520 760 L520 1080"/>
    <path d="M720 760 L720 1080"/>
    <path d="M920 760 L920 1080"/>
    <path d="M1120 760 L1120 1080"/>
    <path d="M1320 760 L1320 1080"/>
    <path d="M1520 760 L1520 1080"/>
    <path d="M1720 760 L1720 1080"/>
  </g>
  <!-- Players silhouettes excited (kids/adults) -->
  <!-- Player 1 left -->
  <g transform="translate(340,510)">
    <circle cx="0" cy="-58" r="14" fill="#1f1f2e"/>
    <rect x="-11" y="-42" width="22" height="48" rx="4" fill="#1f1f2e"/>
    <rect x="-18" y="-8" width="8" height="26" fill="#1f1f2e"/>
    <rect x="10" y="-8" width="8" height="26" fill="#1f1f2e"/>
    <!-- neon vest -->
    <rect x="-9" y="-36" width="18" height="22" rx="2" fill="#00FF9F" opacity="0.9"/>
  </g>
  <!-- Player 2 aiming -->
  <g transform="translate(860,495)">
    <circle cx="0" cy="-62" r="13" fill="#1f1f2e"/>
    <rect x="-10" y="-46" width="20" height="46" rx="3" fill="#1f1f2e"/>
    <rect x="-16" y="-12" width="7" height="24" fill="#1f1f2e"/>
    <rect x="9" y="-12" width="7" height="24" fill="#1f1f2e"/>
    <rect x="-8" y="-40" width="16" height="20" rx="2" fill="#39FF14" opacity="0.95"/>
    <!-- phaser -->
    <rect x="18" y="-32" width="38" height="7" rx="1" fill="#222233" transform="rotate(-18 18 -28)"/>
  </g>
  <!-- Player 3 right elevated -->
  <g transform="translate(1450,470)">
    <circle cx="0" cy="-55" r="12" fill="#1f1f2e"/>
    <rect x="-9" y="-40" width="18" height="42" rx="3" fill="#1f1f2e"/>
    <rect x="-14" y="-6" width="6" height="22" fill="#1f1f2e"/>
    <rect x="8" y="-6" width="6" height="22" fill="#1f1f2e"/>
    <rect x="-7" y="-34" width="14" height="18" rx="2" fill="#00FF9F" opacity="0.85"/>
  </g>
  <!-- More players in background for energy -->
  <g transform="translate(620,530)" opacity="0.6">
    <circle cx="0" cy="-42" r="8" fill="#1f1f2e"/>
    <rect x="-6" y="-32" width="12" height="30" rx="2" fill="#1f1f2e"/>
    <rect x="-4" y="-28" width="8" height="14" rx="1" fill="#39FF14" opacity="0.6"/>
  </g>
  <g transform="translate(1100,525)" opacity="0.55">
    <circle cx="0" cy="-40" r="9" fill="#1f1f2e"/>
    <rect x="-7" y="-30" width="14" height="28" rx="2" fill="#1f1f2e"/>
    <rect x="-5" y="-26" width="10" height="13" rx="1" fill="#00FF9F" opacity="0.7"/>
  </g>
  <!-- Intense green laser beams -->
  <g filter="url(#neonGreen)">
    <!-- main diagonal lasers -->
    <line x1="220" y1="310" x2="780" y2="620" stroke="#00FF9F" stroke-width="3.5" stroke-opacity="0.95">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="260" y1="280" x2="710" y2="580" stroke="#39FF14" stroke-width="2" stroke-opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.4;0.95;0.4" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="1140" y1="295" x2="1620" y2="610" stroke="#00FF9F" stroke-width="3" stroke-opacity="0.9">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="1.9s" repeatCount="indefinite"/>
    </line>
    <line x1="1080" y1="265" x2="1700" y2="580" stroke="#39FF14" stroke-width="1.8" stroke-opacity="0.75">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <!-- horizontal and cross beams -->
    <line x1="420" y1="380" x2="1490" y2="375" stroke="#00FF9F" stroke-width="2.5" stroke-opacity="0.85">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="510" x2="1610" y2="505" stroke="#39FF14" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>
  <!-- Extra thin rapid pulse lasers -->
  <g opacity="0.6" filter="url(#neonGreen)">
    <line x1="510" y1="340" x2="870" y2="470" stroke="#00FF9F" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.2;0.9;0.2" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="1050" y1="355" x2="1350" y2="470" stroke="#39FF14" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="0.55s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- Glowing green accent orbs / light sources -->
  <circle cx="400" cy="260" r="7" fill="#00FF9F" filter="url(#softGlow)" opacity="0.8"/>
  <circle cx="1520" cy="255" r="6" fill="#39FF14" filter="url(#softGlow)" opacity="0.75"/>
  <circle cx="960" cy="205" r="5" fill="#00FF9F" filter="url(#softGlow)" opacity="0.6"/>
  <!-- Cinematic vignette -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
  <!-- Subtle top cosmic haze -->
  <rect x="0" y="0" width="1920" height="280" fill="#00FF9F" opacity="0.015"/>
</svg>