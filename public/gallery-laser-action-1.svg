<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="a1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0a12"/><stop offset="1" stop-color="#030308"/></linearGradient>
    <filter id="ng" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" in="SourceGraphic"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="800" fill="url(#a1)"/>
  <rect x="60" y="140" width="680" height="520" rx="18" fill="#12121f" opacity=".9"/>
  <!-- platforms -->
  <rect x="90" y="340" width="220" height="24" rx="3" fill="#1c1c2b"/>
  <rect x="490" y="340" width="220" height="24" rx="3" fill="#1c1c2b"/>
  <rect x="140" y="470" width="180" height="18" rx="2" fill="#161625"/>
  <rect x="480" y="470" width="180" height="18" rx="2" fill="#161625"/>
  <!-- players -->
  <g transform="translate(220,370)"><circle cx="0" cy="-32" r="11" fill="#222233"/><rect x="-8" y="-20" width="16" height="34" rx="3" fill="#222233"/><rect x="-7" y="-16" width="14" height="15" rx="2" fill="#00FF9F"/></g>
  <g transform="translate(580,365)"><circle cx="0" cy="-30" r="10" fill="#222233"/><rect x="-7" y="-18" width="14" height="30" rx="3" fill="#222233"/><rect x="-6" y="-14" width="12" height="13" rx="1" fill="#39FF14"/></g>
  <!-- lasers green -->
  <g filter="url(#ng)">
    <line x1="170" y1="260" x2="420" y2="410" stroke="#00FF9F" stroke-width="5" opacity=".9"><animate attributeName="opacity" values=".5;1;.5" dur="1.1s" repeatCount="indef"/></line>
    <line x1="380" y1="250" x2="630" y2="400" stroke="#39FF14" stroke-width="4" opacity=".85"><animate attributeName="opacity" values=".4;1;.4" dur="0.85s" repeatCount="indef"/></line>
    <line x1="200" y1="300" x2="610" y2="305" stroke="#00FF9F" stroke-width="2.5" opacity=".7"/>
  </g>
  <circle cx="155" cy="195" r="5" fill="#00FF9F" opacity=".8"/>
  <circle cx="650" cy="190" r="4.5" fill="#39FF14" opacity=".75"/>
  <rect width="800" height="800" fill="#000" opacity=".06"/>
</svg>